
services:
  db:
    image: postgres:17-alpine
    container_name: workboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workboard
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your root .env file}
    ports:
      - "5432:5432"
    volumes:
      - workboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d workboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workboard-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workboard
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your root .env file}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  workboard-data:
